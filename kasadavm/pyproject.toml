[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "unidecompiler-plugin-kasadavm"
version = "0.1.0"
description = "kasadavm"
license = "PolyForm-Noncommercial-1.0.0"
authors = [{ name = "kasadavm" }]
requires-python = ">=3.11"
dependencies = ['unidecompiler>=0.2.2,<0.3.0']

[project.entry-points."unidecompiler.frontends"]
"kasadavm" = "kasadavm.plugin:Frontend"

[tool.setuptools.packages.find]
where = ["src"]
